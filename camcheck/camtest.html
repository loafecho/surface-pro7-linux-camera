<!doctype html><html><body><script>
const log = (...a) => console.log('CAMTEST', ...a);
async function grab(deviceId, label) {
  const s = await navigator.mediaDevices.getUserMedia({video: {deviceId: {exact: deviceId}, width: 1280, height: 720}});
  const t = s.getVideoTracks()[0];
  const v = document.createElement('video'); v.muted = true; v.srcObject = s; document.body.appendChild(v); await v.play();
  let n = 0; const t0 = performance.now();
  await new Promise(res => { const cb = () => { n++; if (n >= 30 || performance.now() - t0 > 8000) res(); else v.requestVideoFrameCallback(cb); }; v.requestVideoFrameCallback(cb); });
  const st = t.getSettings();
  log(JSON.stringify({label, frames: n, secs: ((performance.now()-t0)/1000).toFixed(1), w: st.width, h: st.height}));
  t.stop(); v.remove(); await new Promise(r => setTimeout(r, 1500));
}
(async () => {
  try {
    const pre = await navigator.mediaDevices.getUserMedia({video: true}); pre.getTracks().forEach(t => t.stop());
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    log('devices', JSON.stringify(devs.map(d => d.label)));
    for (const d of devs) { try { await grab(d.deviceId, d.label); } catch (e) { log('fail', d.label, e.name, e.message); } }
  } catch (e) { log('error', e.name, e.message); }
  log('done');
})();
</script></body></html>
